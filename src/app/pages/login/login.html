<div class="login-page">
  <form class="login-card" (ngSubmit)="submit()">
    <div class="brand">गोधन <span>Admin Portal</span></div>

    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    <div class="form-row">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" [type]="showPassword() ? 'text' : 'password'" name="password" [(ngModel)]="password" required autocomplete="current-password" />
        <button
          type="button"
          class="toggle-password"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
          [title]="showPassword() ? 'Hide password' : 'Show password'"
        >
          @if (showPassword()) {
            <!-- eye-off -->
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <!-- eye -->
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
    </div>

    <button class="btn" type="submit" [disabled]="loading() || !email || !password">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="hint">
      Uses the same login as the Godhan farmer app — this account must have been promoted to
      admin first (see <code>scripts/promoteAdmin.mjs</code> in user-service, or ask another admin
      to promote you from the Users page).
    </p>
  </form>
</div>
