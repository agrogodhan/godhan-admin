name: CI

# Railway's "Wait for CI" setting holds the auto-deploy for a push to master until this workflow
# reports success. Runs on pull_request too so a broken change is caught before merge, not just
# before deploy.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the Dockerfile's node:24-slim

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Test (if configured)
        run: npm test --if-present

      # The real gate: a production build exercises the full TypeScript/template compile against
      # environment.prod.ts, catching anything a syntax check alone would miss — and it's exactly
      # what the Dockerfile's build stage does, just run before the Railway build instead of during.
      - name: Production build
        run: npm run build -- --configuration production
